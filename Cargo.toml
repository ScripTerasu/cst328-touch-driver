[package]
name = "cst328-touch-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Sebastian Almendra"]
license = "MIT"
repository = "https://github.com/ScripTerasu/cst328-touch-driver"
description = "Driver crate for CST328/CST3530 touch controllers with async and blocking embedded-hal support."
keywords = ["touchscreen", "embedded-hal", "embedded", "i2c", "cst328"]
categories = ["embedded", "hardware-support"]
readme = "README.md"
exclude = ["docs/", ".*"]

[lib]
# The crates.io package name (above) was taken, but the importable crate name
# doesn't have to match it — this keeps `use cst328::...` working for
# dependents that alias it (`cst328 = { package = "cst328-touch-driver", ... }`,
# see the README) and for this crate's own tests/doctests, which resolve
# against `[lib].name` regardless of the package name.
name = "cst328"

[package.metadata.docs.rs]
# `async` and `blocking` both export a `CST328` type at the crate root and
# are mutually exclusive (see the compile_error! in src/lib.rs) — build docs
# with the default feature set instead of `--all-features`.
features = ["async", "defmt"]

[dependencies]
embedded-hal = "1.0.0"                                    # always: OutputPin (RST)
embedded-hal-async = { version = "1.0.0", optional = true }
defmt = { version = "1.1.1", optional = true }

[features]
default = ["async"]
async = ["dep:embedded-hal-async"]
blocking = []
defmt = ["dep:defmt"]

[dev-dependencies]
futures = "0.3"
embedded-hal-mock = { version = "0.11", features = ["embedded-hal-async", "eh1"] }

[[test]]
name = "async"
path = "tests/async.rs"
required-features = ["async"]

[[test]]
name = "blocking"
path = "tests/blocking.rs"
required-features = ["blocking"]
