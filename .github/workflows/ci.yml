name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [async, blocking]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --no-default-features --features ${{ matrix.feature }}
      # `defmt`'s macros need a #[defmt::global_logger] impl to link a runnable
      # binary against — that's only meaningful on a real embedded target with a
      # transport (e.g. defmt-rtt), so just check that this combination still
      # compiles instead of trying to run tests against it.
      - run: cargo build --no-default-features --features ${{ matrix.feature }},defmt

  clippy:
    name: Clippy (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [async, blocking]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --no-default-features --features ${{ matrix.feature }} --all-targets -- -D warnings

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # No `semver-checks` job yet: cargo-semver-checks needs a previously
  # published crates.io version as a baseline to diff against, and this
  # crate hasn't had a first release yet — "did this change break the public
  # API" is meaningless without an established API to break. Add a job using
  # `obi1kenobi/cargo-semver-checks-action@v2` once `cst328` has an actual
  # release on crates.io; pin `feature-group: default-features` on it, since
  # `async`/`blocking` both being enabled at once is a deliberate
  # compile_error! in src/lib.rs, and the action's default feature-detection
  # would otherwise enable both.

  mutually-exclusive-features:
    name: async + blocking must fail to compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Expect --all-features to fail
        run: |
          if cargo build --all-features; then
            echo "::error::cargo build --all-features unexpectedly succeeded — async and blocking must stay mutually exclusive (see the compile_error! in src/lib.rs)"
            exit 1
          fi

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build --no-default-features --features async
      - run: cargo build --no-default-features --features blocking

  esp32s3-example:
    name: Build examples/waveshare-esp32s3-touch-lcd-2p8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          ldproxy: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo build --release
        working-directory: examples/waveshare-esp32s3-touch-lcd-2p8
